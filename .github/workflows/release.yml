name: release

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 推 tag
      packages: write   # 推 ghcr
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 必须全量：浅克隆读不到历史 tag，版本号会从 v0.0.1 重新开始
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: 测试
        run: go vet ./... && go test ./... -count=1

      # 版本号：读全部 v* tag → 最大 semver → patch +1
      - name: 计算版本号
        id: ver
        run: |
          last=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)
          [ -z "$last" ] && last=0.0.0
          next=$(echo "$last" | awk -F. '{printf "%d.%d.%d", $1, $2, $3+1}')
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: 推 tag
        run: |
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/lyzz0612/secret-gate:v${{ steps.ver.outputs.version }}
            ghcr.io/lyzz0612/secret-gate:latest
            ghcr.io/lyzz0612/secret-gate:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
